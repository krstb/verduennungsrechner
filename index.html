<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdünnungsrechner</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script>
        // Service Worker Registrierung
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.log('SW Fehler:', err));
            });
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Fix für PWA-Ränder und den blauen Balken - identisch mit Verhältnisrechner */
        html {
            background-color: #000000 !important;
            overscroll-behavior-y: none;
        }
        body {
            background-color: #3289D1 !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .tooltip {
            position: relative;
            display: inline-block;
            cursor: pointer;
            color: #3b82f6;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 220px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 0.375rem;
            padding: 0.5rem;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            margin-left: -110px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.75rem;
            font-weight: normal;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="text-white flex items-start justify-center min-h-screen p-4 pt-4">

    <div class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-lg p-5">
        <div class="text-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Verdünnungs-Rechner</h1>
            <p class="text-gray-500 text-sm mt-1">Berechnet die Mengen von Verdünnungen</p>
        </div>

        <div class="space-y-3.5">
            <!-- Ausgangslösung -->
            <div>
                <label for="substance-select" class="block text-sm font-semibold text-gray-800 mb-1.5">Stoff</label>
                <select id="substance-select" class="w-full p-2.5 text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    <option value="default">Wählen Sie einen Stoff</option>
                    <option value="aceton">Aceton</option>
                    <option value="ethanol">Ethanol</option>
                    <option value="glycerin">Glycerin</option>
                    <option value="isopropanol">Isopropanol</option>
                    <option value="methanol">Methanol</option>
                    <option value="salzsaeure">Salzsäure</option>
                    <option value="schwefelsaeure">Schwefelsäure</option>
                    <option value="wasser">Wasser</option>
                    <option value="other">Andere (manuelle Eingabe)</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="initial-concentration" class="block text-sm font-semibold text-gray-800 mb-1.5">Konz. Ausgang (%)</label>
                    <input type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" id="initial-concentration" placeholder="z.B. 99" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-base font-medium focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
                <div>
                    <label for="initial-density" class="block text-sm font-semibold text-gray-800 mb-1.5">
                        Dichte (g/ml)
                        <span class="tooltip font-normal">ⓘ
                            <span class="tooltiptext">Die Dichte wird für gängige Stoffe automatisch ausgefüllt.</span>
                        </span>
                    </label>
                    <input type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" id="initial-density" placeholder="z.B. 0,786" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-base font-medium focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
            </div>

            <!-- Ziellösung -->
            <div class="grid grid-cols-2 gap-3 pt-1">
                <div>
                    <label for="target-concentration" class="block text-sm font-semibold text-gray-800 mb-1.5">Konz. Ziel (%)</label>
                    <input type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" id="target-concentration" placeholder="z.B. 70" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-base font-medium focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
                <div>
                    <label for="final-volume" class="block text-sm font-semibold text-gray-800 mb-1.5">Gesamtmenge</label>
                    <div class="flex items-center space-x-1.5">
                        <input type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" id="final-volume" placeholder="z.B. 500" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-base font-medium focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        <select id="final-volume-unit" class="w-20 p-2.5 text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                            <option value="ml" selected>ml</option>
                            <option value="l">l</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="error-message" class="text-red-500 text-center text-sm mt-3 font-semibold hidden">
            Bitte fülle alle Felder korrekt aus. Die Anfangskonzentration muss größer sein als die Zielkonzentration.
        </div>

        <!-- Ergebnis -->
        <div id="results-container" class="mt-4 pt-4 border-t border-gray-200 hidden">
            <h2 class="text-base font-bold text-center text-gray-800 mb-3">Ergebnis</h2>
            <div class="grid grid-cols-1 gap-2.5">
                <div class="bg-blue-50 p-3 rounded-xl flex items-center justify-between px-4">
                    <span id="substance-label" class="font-semibold text-sm text-blue-800">Ausgangslösung:</span>
                    <span id="result-substance" class="text-sm font-bold text-blue-950"></span>
                </div>
                <div class="bg-green-50 p-3 rounded-xl flex items-center justify-between px-4">
                    <span class="font-semibold text-sm text-green-800">Wasser:</span>
                    <span id="result-water" class="text-sm font-bold text-green-950"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const densities = {
            "aceton": 0.791, "ethanol": 0.789, "glycerin": 1.261,
            "isopropanol": 0.786, "methanol": 0.791, "salzsaeure": 1.18,
            "schwefelsaeure": 1.84, "wasser": 1.0
        };

        function parseGermanFloat(str) {
            if (typeof str !== 'string' || str.trim() === '') return NaN;
            return parseFloat(str.replace(/\./g, '').replace(',', '.'));
        }

        function formatToGermanString(num, decimals) {
            if (typeof num !== 'number' || isNaN(num)) return '';
            return new Intl.NumberFormat('de-DE', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            }).format(num);
        }

        function handleInput(e) {
            let cursorPosition = e.target.selectionStart;
            let originalValue = e.target.value;

            let normalizedValue = originalValue.replace(/\./g, ',');
            let cleanValue = normalizedValue.replace(/[^0-9,]/g, '');

            const parts = cleanValue.split(',');
            if (parts.length > 2) {
                cleanValue = parts[0] + ',' + parts.slice(1).join('');
            }

            e.target.value = cleanValue;

            if (originalValue !== cleanValue) {
                cursorPosition = cursorPosition + (cleanValue.length - originalValue.length);
            }
            try {
                e.target.setSelectionRange(cursorPosition, cursorPosition);
            } catch (err) {}

            calculateSolution();
        }

        function handleFocus(e) {
            const rawValue = e.target.value.replace(/\./g, '');
            if (rawValue) {
                e.target.value = rawValue;
            }
        }

        function autoFillDensityFromSelect() {
            const substanceSelect = document.getElementById('substance-select');
            const densityInput = document.getElementById('initial-density');
            const selectedValue = substanceSelect.value;

            if (selectedValue in densities) {
                densityInput.value = formatToGermanString(densities[selectedValue], 3);
                densityInput.disabled = true;
            } else if (selectedValue === 'other') {
                densityInput.value = '';
                densityInput.disabled = false;
                densityInput.focus();
            } else {
                densityInput.value = '';
                densityInput.disabled = false;
            }
            calculateSolution();
        }

        function formatVolume(volumeMl) {
            if (isNaN(volumeMl)) return '...';
            if (volumeMl >= 1000) {
                return formatToGermanString(volumeMl / 1000, 2) + ' l';
            } else {
                return formatToGermanString(volumeMl, 2) + ' ml';
            }
        }

        function formatInputOnBlur(event, decimals) {
            const input = event.target;
            const value = parseGermanFloat(input.value);
            if (!isNaN(value)) {
                input.value = formatToGermanString(value, decimals);
            }
        }

        function calculateSolution() {
            const initialConcentration = parseGermanFloat(document.getElementById('initial-concentration').value);
            const initialDensity = parseGermanFloat(document.getElementById('initial-density').value);
            const targetConcentration = parseGermanFloat(document.getElementById('target-concentration').value);
            let finalValue = parseGermanFloat(document.getElementById('final-volume').value);
            const finalUnit = document.getElementById('final-volume-unit').value;

            if (finalUnit === 'l') {
                finalValue *= 1000;
            }

            const resultContainer = document.getElementById('results-container');
            const substanceLabel = document.getElementById('substance-label');
            const resultSubstance = document.getElementById('result-substance');
            const resultWater = document.getElementById('result-water');
            const errorMessage = document.getElementById('error-message');
            const substanceSelect = document.getElementById('substance-select');
            const substanceName = substanceSelect.value === 'default' || substanceSelect.value === 'other' ? 'Ausgangslösung' : substanceSelect.options[substanceSelect.selectedIndex].text;

            resultContainer.classList.add('hidden');
            errorMessage.classList.add('hidden');

            if (isNaN(initialConcentration) || isNaN(initialDensity) || isNaN(targetConcentration) || isNaN(finalValue) || initialConcentration <= 0 || initialConcentration > 100 || targetConcentration < 0 || targetConcentration >= 100 || finalValue <= 0 || initialConcentration <= targetConcentration) {
                if (!isNaN(initialConcentration) && !isNaN(targetConcentration) && initialConcentration > 0 && targetConcentration >= 0 && finalValue > 0) {
                    errorMessage.classList.remove('hidden');
                }
                return;
            }

            const initialNeededVolume = (finalValue * targetConcentration) / initialConcentration;
            const diluentNeededVolume = finalValue - initialNeededVolume;
            const initialNeededMass = initialNeededVolume * initialDensity;
            const diluentNeededMass = diluentNeededVolume * 1.0;

            const formattedInitialVolume = formatVolume(initialNeededVolume);
            const formattedDiluentVolume = formatVolume(diluentNeededVolume);

            substanceLabel.textContent = substanceName + ':';
            resultSubstance.innerHTML = `${formatToGermanString(initialNeededMass, 2)} g <span class="font-medium text-blue-800">(${formattedInitialVolume})</span>`;
            resultWater.innerHTML = `${formatToGermanString(diluentNeededMass, 2)} g <span class="font-medium text-green-800">(${formattedDiluentVolume})</span>`;

            resultContainer.classList.remove('hidden');
        }

        const inputsToCalculate = ['initial-concentration', 'initial-density', 'target-concentration', 'final-volume'];
        inputsToCalculate.forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('input', handleInput);
            el.addEventListener('focus', handleFocus);
        });

        document.getElementById('final-volume-unit').addEventListener('change', calculateSolution);
        document.getElementById('substance-select').addEventListener('change', autoFillDensityFromSelect);

        document.getElementById('initial-concentration').addEventListener('blur', (e) => formatInputOnBlur(e, 2));
        document.getElementById('initial-density').addEventListener('blur', (e) => formatInputOnBlur(e, 3));
        document.getElementById('target-concentration').addEventListener('blur', (e) => formatInputOnBlur(e, 2));
        document.getElementById('final-volume').addEventListener('blur', (e) => formatInputOnBlur(e, 2));
    </script>
</body>
</html>
