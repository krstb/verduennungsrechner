<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Verdünnungsrechner</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#3289D1">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.log('SW Fehler:', err));
            });
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            background-color: #3289D1 !important;
            overscroll-behavior-y: none;
            overflow-x: hidden;
            width: 100%;
            -webkit-text-size-adjust: 100%;
        }
        body {
            background-color: #3289D1 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        .tooltip {
            position: relative;
            display: inline-block;
            cursor: pointer;
            color: #3b82f6;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 180px;
            background-color: #262626;
            color: #fff;
            text-align: center;
            border-radius: 0.375rem;
            padding: 0.4rem 0.6rem;
            position: absolute;
            z-index: 20;
            bottom: 125%;
            right: 0;
            opacity: 0;
            transition: opacity 0.2s ease;
            font-size: 0.72rem;
            font-weight: normal;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="text-white flex items-start justify-center min-h-screen p-3.5 sm:p-4 pt-4">
    <div class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-lg p-4 sm:p-5">
        <div class="text-center mb-3 sm:mb-4">
            <h1 class="text-xl sm:text-2xl font-bold text-gray-800 tracking-tight">Verdünnungsrechner</h1>
            <p class="text-gray-500 text-xs sm:text-sm mt-0.5">Berechnet die Mengen von Verdünnungen</p>
        </div>
        <div class="space-y-3">
            <!-- Stoff-Auswahl -->
            <div>
                <label for="substance-select" class="block text-xs sm:text-sm font-semibold text-gray-800 mb-1">Stoff</label>
                <select id="substance-select" class="w-full p-2 sm:p-2.5 text-sm sm:text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    <option value="default">Wählen Sie einen Stoff</option>
                    <option value="aceton">Aceton</option>
                    <option value="ethanol">Ethanol</option>
                    <option value="glycerin">Glycerin</option>
                    <option value="isopropanol">Isopropanol</option>
                    <option value="methanol">Methanol</option>
                    <option value="salzsaeure">Salzsäure</option>
                    <option value="schwefelsaeure">Schwefelsäure</option>
                    <option value="wasser">Wasser</option>
                    <option value="other">Andere (manuelle Eingabe)</option>
                </select>
            </div>
            <!-- Ausgangskonzentration & Dichte -->
            <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
                <div>
                    <label for="initial-concentration" class="block text-xs sm:text-sm font-semibold text-gray-800 mb-1 truncate">Konzentration Ausgang (%)</label>
                    <input type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" id="initial-concentration" placeholder="z.B. 99" class="w-full p-2 sm:p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-sm sm:text-base font-medium focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="initial-density" class="text-xs sm:text-sm font-semibold text-gray-800 truncate">Dichte (g/ml)</label>
                        <span class="tooltip font-normal text-xs leading-none">ⓘ
                            <span class="tooltiptext">Wird für gängige Stoffe automatisch eingetragen.</span>
                        </span>
                    </div>
                    <input type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" id="initial-density" placeholder="z.B. 0,786" class="w-full p-2 sm:p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-sm sm:text-base font-medium focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
            </div>
            <!-- Zielkonzentration & Menge -->
            <div class="grid grid-cols-2 gap-2.5 sm:gap-3 pt-0.5">
                <div>
                    <label for="target-concentration" class="block text-xs sm:text-sm font-semibold text-gray-800 mb-1 truncate">Konzentration Ziel (%)</label>
                    <input type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" id="target-concentration" placeholder="z.B. 70" class="w-full p-2 sm:p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-sm sm:text-base font-medium focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
                <div>
                    <label for="final-volume" class="block text-xs sm:text-sm font-semibold text-gray-800 mb-1 truncate">Gesamtmenge</label>
                    <div class="flex items-center space-x-1.5">
                        <input type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" id="final-volume" placeholder="z.B. 500" class="w-full p-2 sm:p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 text-sm sm:text-base font-medium focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition min-w-0">
                        <select id="final-volume-unit" class="w-16 sm:w-20 p-2 sm:p-2.5 text-sm sm:text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shrink-0">
                            <option value="ml" selected>ml</option>
                            <option value="l">l</option>
                            <option value="g">g</option>
                            <option value="kg">kg</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div id="error-message" class="text-red-500 text-center text-xs sm:text-sm mt-3 font-semibold hidden">
            Bitte alle Felder korrekt ausfüllen. Die Ausgangskonzentration muss größer sein als die Zielkonzentration.
        </div>
        <!-- Ergebnis -->
        <div id="results-container" class="mt-4 pt-3.5 border-t border-gray-200 hidden">
            <h2 class="text-base sm:text-lg font-bold text-center text-gray-800 mb-2.5">Ergebnis</h2>
            <div class="grid grid-cols-1 gap-2.5">
                <div class="bg-blue-50 p-3 rounded-xl flex flex-col items-center justify-center text-center">
                    <span id="substance-label" class="text-sm sm:text-base font-bold text-blue-900 mb-0.5">Ausgangslösung:</span>
                    <span id="result-substance" class="text-base sm:text-lg font-bold text-blue-950"></span>
                </div>
                <div class="bg-green-50 p-3 rounded-xl flex flex-col items-center justify-center text-center">
                    <span class="text-sm sm:text-base font-bold text-green-900 mb-0.5">Wasser:</span>
                    <span id="result-water" class="text-base sm:text-lg font-bold text-green-950"></span>
                </div>
            </div>
        </div>
    </div>
    <script>
        const densities = {
            "aceton": 0.791,
            "ethanol": 0.789,
            "glycerin": 1.261,
            "isopropanol": 0.786,
            "methanol": 0.791,
            "salzsaeure": 1.18,
            "schwefelsaeure": 1.84,
            "wasser": 1.0
        };

        function saveFormData() {
            try {
                const data = {
                    substance: document.getElementById('substance-select').value,
                    initialConcentration: document.getElementById('initial-concentration').value,
                    initialDensity: document.getElementById('initial-density').value,
                    targetConcentration: document.getElementById('target-concentration').value,
                    finalVolume: document.getElementById('final-volume').value,
                    finalVolumeUnit: document.getElementById('final-volume-unit').value
                };
                localStorage.setItem('verduennungsrechner_data', JSON.stringify(data));
            } catch (e) {}
        }

        function loadFormData() {
            try {
                const saved = localStorage.getItem('verduennungsrechner_data');
                if (!saved) return;
                const data = JSON.parse(saved);
                if (data.substance !== undefined) {
                    document.getElementById('substance-select').value = data.substance;
                    if (data.substance in densities) {
                        document.getElementById('initial-density').disabled = true;
                    } else if (data.substance === 'other') {
                        document.getElementById('initial-density').disabled = false;
                    }
                }
                if (data.initialConcentration !== undefined) {
                    document.getElementById('initial-concentration').value = data.initialConcentration;
                }
                if (data.initialDensity !== undefined) {
                    document.getElementById('initial-density').value = data.initialDensity;
                }
                if (data.targetConcentration !== undefined) {
                    document.getElementById('target-concentration').value = data.targetConcentration;
                }
                if (data.finalVolume !== undefined) {
                    document.getElementById('final-volume').value = data.finalVolume;
                }
                if (data.finalVolumeUnit !== undefined) {
                    document.getElementById('final-volume-unit').value = data.finalVolumeUnit;
                }
                calculateSolution();
            } catch (e) {}
        }

        function parseGermanFloat(str) {
            if (typeof str !== 'string' || str.trim() === '') return NaN;
            return parseFloat(str.replace(/\./g, '').replace(',', '.'));
        }

        function formatToGermanString(num, decimals) {
            if (typeof num !== 'number' || isNaN(num)) return '';
            return new Intl.NumberFormat('de-DE', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            }).format(num);
        }

        function handleInput(e) {
            let cursorPosition = e.target.selectionStart;
            let originalValue = e.target.value;
            let normalizedValue = originalValue.replace(/\./g, ',');
            let cleanValue = normalizedValue.replace(/[^0-9,]/g, '');

            const parts = cleanValue.split(',');
            if (parts.length > 2) {
                cleanValue = parts[0] + ',' + parts.slice(1).join('');
            }

            e.target.value = cleanValue;

            if (originalValue !== cleanValue) {
                cursorPosition = cursorPosition + (cleanValue.length - originalValue.length);
            }

            try {
                e.target.setSelectionRange(cursorPosition, cursorPosition);
            } catch (err) {}

            saveFormData();
            calculateSolution();
        }

        function handleFocus(e) {
            const rawValue = e.target.value.replace(/\./g, '');
            if (rawValue) {
                e.target.value = rawValue;
            }
        }

        function autoFillDensityFromSelect() {
            const substanceSelect = document.getElementById('substance-select');
            const densityInput = document.getElementById('initial-density');
            const selectedValue = substanceSelect.value;

            if (selectedValue in densities) {
                densityInput.value = formatToGermanString(densities[selectedValue], 3);
                densityInput.disabled = true;
            } else if (selectedValue === 'other') {
                densityInput.value = '';
                densityInput.disabled = false;
                densityInput.focus();
            } else {
                densityInput.value = '';
                densityInput.disabled = false;
            }

            saveFormData();
            calculateSolution();
        }

        function formatVolume(volumeMl) {
            if (isNaN(volumeMl)) return '...';
            if (volumeMl >= 1000) {
                return formatToGermanString(volumeMl / 1000, 2) + ' l';
            } else {
                return formatToGermanString(volumeMl, 2) + ' ml';
            }
        }

        function formatMass(massG) {
            if (isNaN(massG)) return '...';
            if (massG >= 1000) {
                return formatToGermanString(massG / 1000, 2) + ' kg';
            } else {
                return formatToGermanString(massG, 2) + ' g';
            }
        }

        function formatInputOnBlur(event, decimals) {
            const input = event.target;
            const value = parseGermanFloat(input.value);
            if (!isNaN(value)) {
                input.value = formatToGermanString(value, decimals);
            }
            saveFormData();
        }

        function calculateSolution() {
            const initialConcentration = parseGermanFloat(document.getElementById('initial-concentration').value);
            const initialDensity = parseGermanFloat(document.getElementById('initial-density').value);
            const targetConcentration = parseGermanFloat(document.getElementById('target-concentration').value);
            let finalValue = parseGermanFloat(document.getElementById('final-volume').value);
            const finalUnit = document.getElementById('final-volume-unit').value;

            const resultContainer = document.getElementById('results-container');
            const substanceLabel = document.getElementById('substance-label');
            const resultSubstance = document.getElementById('result-substance');
            const resultWater = document.getElementById('result-water');
            const errorMessage = document.getElementById('error-message');

            const substanceSelect = document.getElementById('substance-select');
            const substanceName = substanceSelect.value === 'default' || substanceSelect.value === 'other' ? 'Ausgangslösung' : substanceSelect.options[substanceSelect.selectedIndex].text;

            resultContainer.classList.add('hidden');
            errorMessage.classList.add('hidden');

            if (
                isNaN(initialConcentration) || 
                isNaN(initialDensity) || 
                isNaN(targetConcentration) || 
                isNaN(finalValue) || 
                initialConcentration <= 0 || 
                initialConcentration > 100 || 
                targetConcentration < 0 || 
                targetConcentration >= 100 || 
                finalValue <= 0 || 
                initialConcentration <= targetConcentration
            ) {
                if (!isNaN(initialConcentration) && !isNaN(targetConcentration) && initialConcentration > 0 && targetConcentration >= 0 && finalValue > 0) {
                    errorMessage.classList.remove('hidden');
                }
                return;
            }

            let initialNeededMass = 0;
            let initialNeededVolume = 0;
            let diluentNeededMass = 0;
            let diluentNeededVolume = 0;

            if (finalUnit === 'ml' || finalUnit === 'l') {
                let finalVolumeMl = finalValue;
                if (finalUnit === 'l') {
                    finalVolumeMl *= 1000;
                }
                initialNeededVolume = (finalVolumeMl * targetConcentration) / initialConcentration;
                diluentNeededVolume = finalVolumeMl - initialNeededVolume;

                initialNeededMass = initialNeededVolume * initialDensity;
                diluentNeededMass = diluentNeededVolume * 1.0;
            } else {
                let finalMassG = finalValue;
                if (finalUnit === 'kg') {
                    finalMassG *= 1000;
                }
                initialNeededMass = (finalMassG * targetConcentration) / initialConcentration;
                diluentNeededMass = finalMassG - initialNeededMass;

                initialNeededVolume = initialNeededMass / initialDensity;
                diluentNeededVolume = diluentNeededMass / 1.0;
            }

            const formattedInitialVolume = formatVolume(initialNeededVolume);
            const formattedDiluentVolume = formatVolume(diluentNeededVolume);
            const formattedInitialMass = formatMass(initialNeededMass);
            const formattedDiluentMass = formatMass(diluentNeededMass);

            substanceLabel.textContent = substanceName + ':';
            resultSubstance.innerHTML = `${formattedInitialMass} <span class="font-semibold text-blue-900">(${formattedInitialVolume})</span>`;
            resultWater.innerHTML = `${formattedDiluentMass} <span class="font-semibold text-green-900">(${formattedDiluentVolume})</span>`;

            resultContainer.classList.remove('hidden');
        }

        const inputsToCalculate = ['initial-concentration', 'initial-density', 'target-concentration', 'final-volume'];
        inputsToCalculate.forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('input', handleInput);
            el.addEventListener('focus', handleFocus);
        });

        document.getElementById('final-volume-unit').addEventListener('change', () => {
            saveFormData();
            calculateSolution();
        });

        document.getElementById('substance-select').addEventListener('change', autoFillDensityFromSelect);

        document.getElementById('initial-concentration').addEventListener('blur', (e) => formatInputOnBlur(e, 2));
        document.getElementById('initial-density').addEventListener('blur', (e) => formatInputOnBlur(e, 3));
        document.getElementById('target-concentration').addEventListener('blur', (e) => formatInputOnBlur(e, 2));
        document.getElementById('final-volume').addEventListener('blur', (e) => formatInputOnBlur(e, 2));

        loadFormData();
    </script>
</body>
</html>
